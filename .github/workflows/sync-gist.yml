name: Mirror peak data to Gist

# data/peaks.json in this repo is the source of truth. The Gist is a mirror that
# the live site reads, so edits made directly on the Gist will be overwritten.

on:
  push:
    branches: [main]
    paths: ['data/peaks.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gist-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GIST_ID: 46213d7d93292f14ffd54d955b7f3f67
      DATA_FILE: data/peaks.json
    steps:
      - uses: actions/checkout@v5

      - name: Validate the dataset before publishing
        run: |
          python3 - <<'PY'
          import json, sys, collections
          data = json.load(open("data/peaks.json"))
          peaks = data["peaks"]
          ids = [p["id"] for p in peaks]
          dupes = [i for i, n in collections.Counter(ids).items() if n > 1]
          problems = []
          if dupes:
              problems.append(f"duplicate ids: {dupes}")
          if max(ids) >= data["next_id"]:
              problems.append(f"next_id {data['next_id']} must exceed max id {max(ids)}")
          missing = [p["name"] for p in peaks if not p.get("summit", {}).get("lat")]
          if missing:
              problems.append(f"missing coordinates: {missing}")
          if problems:
              sys.exit("Refusing to publish:\n  " + "\n  ".join(problems))
          current = sum(1 for p in peaks if p["status"] == "current")
          print(f"{len(peaks)} peaks, {current} current, next_id {data['next_id']}")
          PY

      - name: Push to the Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GIST_TOKEN secret is not set. Create a classic token with only the 'gist' scope and add it with: gh secret set GIST_TOKEN"
            exit 1
          fi
          jq -Rs --arg name peaks.json '{files: {($name): {content: .}}}' "$DATA_FILE" > payload.json
          gh api -X PATCH "gists/$GIST_ID" --input payload.json --silent

      - name: Confirm the Gist matches
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Check the API, not the raw URL: raw gist content is edge-cached and
          # can serve the previous revision for around a minute after a write.
          # The API itself is only eventually consistent, so a read immediately
          # after the write can still land on a replica holding the old revision.
          # Retry before calling it a genuine mismatch.
          for attempt in 1 2 3 4 5; do
            gh api "gists/$GIST_ID" --jq '.files["peaks.json"].content' > published.json
            if diff -q <(jq -S . "$DATA_FILE") <(jq -S . published.json) > /dev/null; then
              echo "Gist is in sync with $DATA_FILE (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: Gist has not caught up yet, waiting..."
            sleep 5
          done
          echo "::error::Gist content does not match $DATA_FILE after publishing"
          exit 1

