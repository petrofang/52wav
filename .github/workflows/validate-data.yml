name: Validate peak data

# data/peaks.json in this repo is the single source of truth. This check runs
# before it can reach the live site, so a broken dataset fails here rather than
# in someone's browser.

on:
  push:
    branches: [main]
    paths: ['data/peaks.json']
  pull_request:
    paths: ['data/peaks.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the dataset
        run: |
          python3 - <<'PY'
          import json, sys, collections
          data = json.load(open("data/peaks.json"))
          peaks = data["peaks"]
          ids = [p["id"] for p in peaks]
          dupes = [i for i, n in collections.Counter(ids).items() if n > 1]
          problems = []
          if dupes:
              problems.append(f"duplicate ids: {dupes}")
          if max(ids) >= data["next_id"]:
              problems.append(f"next_id {data['next_id']} must exceed max id {max(ids)}")
          missing = [p["name"] for p in peaks if not p.get("summit", {}).get("lat")]
          if missing:
              problems.append(f"missing coordinates: {missing}")

          # Every peak is described by its routes: one array, one recommendation,
          # and a trailhead on each route rather than on the peak.
          legacy = [p["name"] for p in peaks if "route" in p or "trailhead" in p or "alt_routes" in p]
          if legacy:
              problems.append(f"peak-level route or trailhead still present: {legacy}")
          noroutes = [p["name"] for p in peaks if not isinstance(p.get("routes"), list) or not p["routes"]]
          if noroutes:
              problems.append(f"no routes: {noroutes}")
          for p in peaks:
              picked = [r for r in p.get("routes", []) if r.get("recommended")]
              if len(picked) != 1:
                  problems.append(f"{p['name']}: {len(picked)} routes marked recommended, expected 1")
              for r in p.get("routes", []):
                  th = r.get("trailhead") or {}
                  if th.get("lat") is None or th.get("lon") is None:
                      problems.append(f"{p['name']}: route '{r.get('name')}' has no trailhead")

          # Peak sources reference the top-level registry by id, so a typo there would
          # silently drop the link's label rather than showing anything wrong.
          registry = {s.get("id") for s in data.get("sources", []) if s.get("id")}
          if not registry:
              problems.append("top-level sources registry is missing or has no ids")
          for p in peaks:
              for s in p.get("sources", []):
                  if s.get("source") not in registry:
                      problems.append(f"{p['name']}: source id '{s.get('source')}' is not in the registry")
                  if not s.get("url"):
                      problems.append(f"{p['name']}: source '{s.get('source')}' has no url")

          if problems:
              sys.exit("Dataset is not publishable:\n  " + "\n  ".join(problems))
          current = sum(1 for p in peaks if p["status"] == "current")
          routes = sum(len(p["routes"]) for p in peaks)
          print(f"{len(peaks)} peaks, {current} current, {routes} routes, next_id {data['next_id']}")
          PY
