<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - 52 With a View</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8fafc;
      color: #1f2937;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      max-width: 36rem;
      border: 1px solid #d1d5db;
      border-radius: 1rem;
      background: white;
      padding: 1.25rem;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 0.5rem; color: #065f46; }
    p { line-height: 1.5; margin: 0.5rem 0; }
    a { color: #065f46; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You're offline</h1>
    <p>The app can still show content that was already cached, but this page needs a connection right now.</p>
    <p>Try again when you have signal or return to the home screen and reopen the app.</p>
    <p><a href="./">Back to app</a></p>
  </main>
</body>
</html>
